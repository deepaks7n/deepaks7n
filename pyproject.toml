[project]
name = "deepaks7n-profile"
version = "0.1.0"
requires-python = ">=3.13"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.1",
    "ty==0.0.89",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C90", "PLR", "TID", "D"]
ignore = ["D203", "D213", "PLR2004"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-args = 5
max-statements = 100

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
